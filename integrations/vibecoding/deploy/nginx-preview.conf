# Add alongside the existing /kuaixue/runtime/exchange and /kuaixue/runtime/ws/ routes.
# The signed preview token is in the path and is checked against the course entitlement
# for the HTML document and every relative asset request.
location ^~ /kuaixue/runtime/preview/ {
    proxy_pass http://unix:/run/kuaixue-vibe/gateway.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
